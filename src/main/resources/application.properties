spring.application.name=project

# 1. Configurazione Porta (Importante per Render)
# Legge la variabile PORT assegnata da Render; se non esiste (in locale) usa 8080
server.port=${PORT:8080}

# 2. Configurazione Connessione Database PostgreSQL su Supabase (unwind-db)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.jglmagugukkzcqosvihf.supabase.co:5432/unwind-db}?prepareThreshold=0
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tuapassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Configurazione Hibernate / JPA per PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 4. Limiti Upload Immagini
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 5. Configurazione avanzata HikariCP per evitare errori di prepared statement / connessioni perse
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=20000
spring.datasource.hikari.auto-commit=true

# 6. Configurazione Supabase Storage (Bucket: prodotti_image)
supabase.url=https://jglmagugukkzcqosvihf.supabase.co
supabase.key=${SUPABASE_KEY:tua-chiave-api-supabase}
supabase.bucket=prodotti_image