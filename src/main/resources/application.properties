spring.application.name=project
# Configurazione Connessione MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/unwind_project?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234

# Configurazione Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Limiti per l'upload delle immagini dei prodotti
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB