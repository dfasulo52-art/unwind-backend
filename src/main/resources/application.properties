spring.application.name=project

# 1. Configurazione Porta (Importante per Render)
# Legge la variabile PORT assegnata da Render; se non esiste (in locale) usa 8080
server.port=${PORT:8080}

# 2. Configurazione Connessione Database MySQL
# In locale usa localhost, su Render legge la variabile MYSQLURL oppure la connessione ad Aiven
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/unwind_project?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

# 3. Configurazione Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 4. Limiti Upload Immagini
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB