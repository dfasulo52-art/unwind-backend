spring.application.name=project

# 1. Configurazione Porta (Importante per Render)
# Legge la variabile PORT assegnata da Render; se non esiste (in locale) usa 8080
server.port=${PORT:8080}

# 2. Configurazione Connessione Database PostgreSQL
# In locale usa localhost:5432, su Render legge la variabile SPRING_DATASOURCE_URL configurata con Supabase
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tuapassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Configurazione Hibernate / JPA per PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 4. Limiti Upload Immagini
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB